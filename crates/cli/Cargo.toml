[package]
name = "kulyrax-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Command-line runner for the Kulyrax projection engine."
keywords = ["cqrs", "event-sourcing", "cli", "projection"]
categories = ["command-line-utilities", "database"]
readme = "README.md"

[[bin]]
name = "kulyrax"
path = "src/main.rs"

[dependencies]
kulyrax-core = { workspace = true }
kulyrax-ingest = { workspace = true }
kulyrax-backends = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3"

[dev-dependencies]
# The crash tests (tests/file_store_crash.rs) abort the binary at chosen points.
kulyrax-core = { workspace = true, features = ["crash-points"] }
tempfile = "3"
