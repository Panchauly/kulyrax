[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/ingest",
    "crates/client",
    "crates/adapters/postgres",
    "crates/adapters/elasticsearch",
    "crates/adapters/mysql",
    "crates/adapters/redis",
    "crates/adapters/mongodb",
    "crates/adapters/neo4j",
    "crates/backends",
]
# examples/ are standalone Cargo projects (each depends on the engine via a
# path dependency, the way a real consumer would depend on a published
# version) — kept out of the workspace so they build and version
# independently and never affect `cargo build --workspace` / the main lockfile.
exclude = ["examples"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kulyrax/kulyrax"
authors = ["Kulyrax Contributors"]
rust-version = "1.89"

[workspace.dependencies]
kulyrax-core = { path = "crates/core", version = "0.10.0" }
kulyrax-ingest = { path = "crates/ingest", version = "0.10.0" }
kulyrax-client = { path = "crates/client", version = "0.10.0" }
kulyrax-adapter-postgres = { path = "crates/adapters/postgres", version = "0.10.0" }
kulyrax-adapter-elasticsearch = { path = "crates/adapters/elasticsearch", version = "0.10.0" }
kulyrax-adapter-mysql = { path = "crates/adapters/mysql", version = "0.10.0" }
kulyrax-adapter-redis = { path = "crates/adapters/redis", version = "0.10.0" }
kulyrax-adapter-mongodb = { path = "crates/adapters/mongodb", version = "0.10.0" }
kulyrax-adapter-neo4j = { path = "crates/adapters/neo4j", version = "0.10.0" }
kulyrax-backends = { path = "crates/backends", version = "0.10.0" }
